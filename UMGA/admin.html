<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | PhishGuard</title>


    <!-- =====================================================
         GOOGLE FONTS
         ===================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         FONT AWESOME
         ===================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- =====================================================
         ADMIN CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="css/admin.css"
    >


    <!-- =====================================================
         ADMIN PAGE FIX / OVERRIDE
         ===================================================== -->

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }


        body {
            font-family: "Poppins", sans-serif;
        }


        .login-page {
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            z-index: 2;
        }


        .login-card {
            width: 100%;
            max-width: 470px;
            padding: 38px;
            position: relative;
            z-index: 5;
        }


        /* =================================================
           BACK HOME
           ================================================= */

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            margin-bottom: 28px;

            color: #aeb8cc;
            text-decoration: none;

            font-size: 13px;
            font-weight: 500;

            transition: color 0.2s ease;
        }


        .back-home:hover {
            color: #ffffff;
        }


        /* =================================================
           LOGO - CENTERED
           ================================================= */

        .login-logo {
            width: 86px;
            height: 86px;

            margin-bottom: 28px;
            margin-left: auto;
            margin-right: auto;

            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .login-logo img {
            width: 72px !important;
            height: 72px !important;

            max-width: 72px !important;
            max-height: 72px !important;

            object-fit: contain;

            display: block;

            position: relative;
            z-index: 2;
        }


        .logo-ring {
            position: absolute;

            width: 86px;
            height: 86px;

            border-radius: 50%;

            border: 1px solid rgba(99, 102, 241, 0.35);

            box-shadow:
                0 0 30px rgba(99, 102, 241, 0.12),
                inset 0 0 20px rgba(99, 102, 241, 0.05);
        }


        /* =================================================
           HEADING
           ================================================= */

        .login-heading {
            margin-bottom: 30px;
        }


        .login-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            margin-bottom: 10px;

            font-family: "JetBrains Mono", monospace;

            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;

            color: #8f9ab0;
        }


        .login-label span {
            width: 7px;
            height: 7px;

            display: inline-block;

            border-radius: 50%;

            background: #6366f1;

            box-shadow: 0 0 10px rgba(99, 102, 241, 0.8);
        }


        .login-heading h1 {
            margin: 0 0 10px;

            font-size: clamp(32px, 5vw, 46px);
            line-height: 1.1;

            font-weight: 700;

            color: #ffffff;
            text-align: center;
        }


        .login-heading p {
            margin: 0;

            max-width: 430px;

            font-size: 14px;
            line-height: 1.7;

            color: #8f9ab0;
            text-align: center;
            margin-left: auto;
            margin-right: auto;
        }


        /* =================================================
           FORM
           ================================================= */

        #loginForm {
            width: 100%;
        }


        .input-group {
            margin-bottom: 20px;
        }


        .input-group label {
            display: block;

            margin-bottom: 8px;

            font-family: "JetBrains Mono", monospace;

            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.2px;

            color: #8f9ab0;
        }


        .input-wrapper {
            width: 100%;

            min-height: 52px;

            display: flex;
            align-items: center;

            position: relative;

            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 10px;

            background: rgba(15, 23, 42, 0.75);

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        .input-wrapper:focus-within {
            border-color: rgba(99, 102, 241, 0.7);

            box-shadow:
                0 0 0 3px rgba(99, 102, 241, 0.10);
        }


        .input-wrapper > i {
            width: 48px;

            text-align: center;

            color: #69758c;

            font-size: 15px;

            flex-shrink: 0;
        }


        .input-wrapper input {
            width: 100%;

            height: 50px;

            padding: 0 14px 0 0;

            border: none;
            outline: none;

            background: transparent;

            color: #ffffff;

            font-family: "Poppins", sans-serif;

            font-size: 14px;
        }


        .input-wrapper input::placeholder {
            color: #667085;
        }


        .password-toggle {
            width: 48px;
            height: 50px;

            flex-shrink: 0;

            border: none;
            outline: none;

            background: transparent;

            color: #69758c;

            cursor: pointer;

            transition: color 0.2s ease;
        }


        .password-toggle:hover {
            color: #ffffff;
        }


        /* =================================================
           MESSAGE
           ================================================= */

        .login-message {
            min-height: 20px;

            margin: -4px 0 12px;

            font-size: 13px;

            color: #f87171;
            text-align: center;
        }


        /* =================================================
           LOGIN BUTTON
           ================================================= */

        .login-button {
            width: 100%;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            border: none;
            border-radius: 10px;

            background: #6366f1;

            color: #ffffff;

            font-family: "Poppins", sans-serif;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }


        .login-button:hover {
            background: #5558e8;

            box-shadow:
                0 8px 25px rgba(99, 102, 241, 0.22);
        }


        .login-button:active {
            transform: scale(0.98);
        }


        .button-loader {
            display: none;

            width: 16px;
            height: 16px;

            border: 2px solid rgba(255,255,255,0.35);
            border-top-color: #ffffff;

            border-radius: 50%;

            animation: spin 0.7s linear infinite;
        }


        .login-button.loading .button-loader {
            display: inline-block;
        }


        .login-button.loading .button-text,
        .login-button.loading > i {
            display: none;
        }


        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }


        /* =================================================
           SECURITY NOTE
           ================================================= */

        .security-note {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            margin-top: 24px;

            color: #68748b;

            font-family: "JetBrains Mono", monospace;

            font-size: 10px;
            letter-spacing: 0.3px;
        }


        .security-note i {
            color: #6366f1;
        }


        /* =================================================
           MOBILE
           ================================================= */

        @media (max-width: 600px) {

            .login-page {
                padding: 25px 18px;
            }


            .login-card {
                padding: 25px 20px;
            }


            .login-heading h1 {
                font-size: 34px;
            }


            .login-heading p {
                font-size: 13px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         BACKGROUND
         ===================================================== -->

    <div class="background-grid"></div>

    <div class="background-glow"></div>


    <!-- =====================================================
         LOGIN PAGE
         ===================================================== -->

    <main class="login-page">

        <section class="login-card">


            <!-- BACK -->

            <a
                href="index.html"
                class="back-home"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Back to PhishGuard

            </a>


            <!-- LOGO - CENTERED -->

            <div class="login-logo">

                <div class="logo-ring"></div>

                <img
                    src="assets/images/um-logo.png"
                    alt="University of Mindanao Logo"
                >

            </div>


            <!-- HEADING -->

            <div class="login-heading">

                <div class="login-label">

                    <span></span>

                    ADMINISTRATOR ACCESS

                </div>


                <h1>
                    Welcome back.
                </h1>


                <p>
                    Sign in to manage phishing awareness
                    campaigns and view simulation activity.
                </p>

            </div>


            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        ADMIN EMAIL
                    </label>


                    <div class="input-wrapper">

                        <i class="fa-regular fa-envelope"></i>


                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="admin@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        PASSWORD
                    </label>


                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>


                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                        >

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- LOGIN MESSAGE -->

                <div
                    id="loginMessage"
                    class="login-message"
                    aria-live="polite"
                ></div>


                <!-- SIGN IN -->

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >

                    <span class="button-text">
                        Sign In
                    </span>


                    <i class="fa-solid fa-arrow-right"></i>


                    <span class="button-loader"></span>

                </button>

            </form>


            <!-- SECURITY -->

            <div class="security-note">

                <i class="fa-solid fa-shield-halved"></i>

                <span>
                    Protected by Supabase Authentication
                </span>

            </div>


        </section>

    </main>


    <!-- =====================================================
         SUPABASE
         ===================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =====================================================
         PHISHGUARD SUPABASE CONFIG
         ===================================================== -->

    <script src="js/supabase.js"></script>


    <!-- =====================================================
         ADMIN LOGIN LOGIC
         ===================================================== -->

    <script src="js/admin.js"></script>


</body>

</html>
